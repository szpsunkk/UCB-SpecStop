name: Offline runtime checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt -r hardware/requirements_hw.txt
      - run: >-
          python -m pytest hardware/validate_hw.py
          hardware/validate_closed_loop_extensions.py hardware/validate_delay_proxy.py
          hardware/validate_target_precision.py hardware/validate_graph_draft.py
          experiments/table4/test_capability.py -q
