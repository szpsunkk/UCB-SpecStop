name: Reproducibility
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r docs/requirements-cpu-lock.txt
      - run: python scripts/check_public_release.py
      - run: bash scripts/smoke.sh
      - run: python scripts/reproduce.py markov
      - run: python scripts/reproduce.py figures
